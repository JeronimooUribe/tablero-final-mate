<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tablero Final de Matemáticas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: cuaderno cuadriculado. Ruta de niveles a la izquierda (arriba en el celular), mesa de trabajo a la derecha. Modo oscuro = pizarrón. */
:root{
  --bg:#F3F5F9; --paper:#FFFFFF; --grid:rgba(43,71,201,.055); --fg:#14202E; --muted:#5A6676; --line:#D8DEE8;
  --ink:#2B47C9; --ink-soft:#E6EBFB; --on-ink:#FFFFFF;
  --ok:#14744B; --ok-soft:#E0F2E8; --bad:#B3302A; --bad-soft:#FBE6E4; --warn:#8F5B00; --warn-soft:#FFF1D6;
  --f-display:"Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", "Segoe UI", system-ui, sans-serif;
  --f-math:"STIX Two Text", "Cambria Math", "Cambria", Georgia, serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1512; --paper:#14201B; --grid:rgba(255,255,255,.035); --fg:#E7EEEA; --muted:#98A79F; --line:#26362F;
  --ink:#93B2FF; --ink-soft:#1B2A43; --on-ink:#0D1512;
  --ok:#5DD49B; --ok-soft:#113226; --bad:#FF8C82; --bad-soft:#3A1917; --warn:#F3C063; --warn-soft:#3A2B0F; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1512; --paper:#14201B; --grid:rgba(255,255,255,.035); --fg:#E7EEEA; --muted:#98A79F; --line:#26362F;
  --ink:#93B2FF; --ink-soft:#1B2A43; --on-ink:#0D1512;
  --ok:#5DD49B; --ok-soft:#113226; --bad:#FF8C82; --bad-soft:#3A1917; --warn:#F3C063; --warn-soft:#3A2B0F; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
a{color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--paper);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;text-decoration:none;color:var(--fg);display:flex;align-items:center;gap:8px}
.brand .lim{font-family:var(--f-math);font-style:italic;font-weight:400;color:var(--ink);font-size:20px}
.top .sp{flex:1}
.clock{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.clock b{color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--ink-soft);color:var(--ink);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)}

.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 80px}
.ruta{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);align-self:start;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 90px);overflow:auto}
.ruta .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 10px 4px}
.step{display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--fg);font-size:14px}
.step:hover{background:var(--ink-soft)}
.step.on{background:var(--ink);color:var(--on-ink)}
.step .no{font-family:var(--f-display);font-weight:600;font-size:12px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-variant-numeric:tabular-nums}
.step.done .no{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.step.on .no{border-color:var(--on-ink)}
.step .st{font-size:11px;color:var(--muted)} .step.on .st{color:var(--on-ink);opacity:.85}
.step.special .no{border-style:dashed}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:14px;padding-block:12px 80px}
  .ruta{position:static;flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:6px;gap:6px;scrollbar-width:thin}
  .ruta .lbl{display:none}
  .step{grid-template-columns:24px auto;white-space:nowrap;border:1px solid var(--line);background:var(--paper)}
  .step .st{display:none}
  .top .clock{order:3;width:100%}
}

main{min-width:0;display:flex;flex-direction:column;gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px}
.card.flat{background:transparent;border:none;padding:0}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lead{font-size:17px;max-width:65ch}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:700px){.grid2{grid-template-columns:minmax(0,1fr)}}

.btn{border:1px solid var(--line);background:var(--paper);padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.big{padding:12px 20px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px;background:var(--bg);flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:6px 12px;border-radius:6px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* matemática */
.m{font-family:var(--f-math);font-size:1.12em;white-space:normal}
.m i,.mi{font-family:var(--f-math);font-style:italic}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.9em;margin:0 .12em;line-height:1.25}
.fr>span{padding:0 .22em;white-space:nowrap}
.fr>span:first-child{border-bottom:1.4px solid currentColor;padding-bottom:1px}
.sq{white-space:nowrap;display:inline-flex;align-items:baseline}
.sq .rad{border-top:1.4px solid currentColor;padding:1px .15em 0;margin-left:.02em}
.sq .idx{font-size:.62em;margin-right:-.35em;transform:translateY(-.55em);display:inline-block}
.bigx{font-size:24px;padding:14px 0 6px;overflow-x:auto;line-height:1.6}

/* aprende */
.sec h3{font-size:16px;margin-bottom:8px}
.idea{font-size:18px;font-family:var(--f-display);font-weight:500;line-height:1.4;max-width:60ch}
.recipe{counter-reset:r;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.recipe li{counter-increment:r;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.recipe li::before{content:counter(r);font-family:var(--f-display);font-weight:700;width:26px;height:26px;border-radius:7px;background:var(--ink-soft);color:var(--ink);display:grid;place-items:center;font-size:13px}
.examen{background:var(--ink-soft);border-radius:10px;padding:14px 16px}
.examen .eyebrow{color:var(--ink)}
.traps{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.traps li::marker{color:var(--bad)}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tw{overflow-x:auto}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.steps li{padding-left:4px}
.reveal-steps li[hidden]{display:none}
.need a{margin-right:6px}

/* practica */
.prob .q{font-size:16px;font-weight:500}
.ansbox{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.field{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.field label{font-weight:600;min-width:0}
input.ans{font-family:var(--f-math);font-size:19px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:180px;max-width:100%}
input.ans:focus{border-color:var(--ink);outline:none}
.keys{display:flex;gap:6px}
.keys button{width:40px;height:36px;border:1px solid var(--line);background:var(--bg);border-radius:7px;font-family:var(--f-math);font-size:18px}
.mc{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:center;text-align:left;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--paper)}
.opt:hover{border-color:var(--ink)}
.opt[aria-checked="true"]{border-color:var(--ink);background:var(--ink-soft)}
.opt .k{font-family:var(--f-display);font-weight:700;font-size:13px;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;background:var(--bg)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.relrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.relrow .seg button{font-family:var(--f-math);font-size:17px}
.relrow .seg button[data-r="R"]{font-family:var(--f-body);font-size:13px}
.fb{border-radius:10px;padding:14px 16px;margin-top:14px}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)} .fb.info{background:var(--warn-soft)}
.fb .h{font-family:var(--f-display);font-weight:700;font-size:17px;margin-bottom:4px}
.fb.ok .h{color:var(--ok)} .fb.bad .h{color:var(--bad)} .fb.info .h{color:var(--warn)}
details summary{cursor:pointer;font-weight:600;color:var(--ink);margin-top:8px}
.statbar{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.statbar b{color:var(--fg);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:30px;height:30px;border-radius:7px;border:1.5px solid var(--line);background:var(--paper);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.dot.ans{background:var(--ink-soft);border-color:var(--ink)}
.dot.cur{outline:2px solid var(--ink);outline-offset:1px}
.dot.r{background:var(--ok-soft);border-color:var(--ok)} .dot.w{background:var(--bad-soft);border-color:var(--bad)}
.nota{font-family:var(--f-display);font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--ok)}
.res-item{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.tag{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.timer{font-family:var(--f-display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.cuaderno .qa{border-top:1px solid var(--line);padding:12px 0}
.cuaderno .qa:first-child{border-top:none}
.cuaderno .mod{margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--ok-soft)}
@media (prefers-reduced-motion:no-preference){
  .fb,.prob{animation:in .18s ease-out}
  @keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
}
</style>

<header class="top"><div class="top-in">
  <a class="brand" href="#inicio"><span class="lim">f(x)</span> Tablero Final</a>
  <span class="pill" id="pMast">0/11 dominados</span>
  <span class="sp"></span>
  <span class="clock" id="clock"></span>
</div></header>
<div class="shell">
  <nav class="ruta" id="ruta" aria-label="Ruta de estudio"></nav>
  <main id="main"></main>
</div>

<script>
"use strict";
/* ============ utilidades ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const rnz=(a,b)=>{let v;do{v=ri(a,b)}while(v===0);return v};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
const MINUS='−';
class Q{
  constructor(n,d=1){if(d===0)throw new Error('div0');if(d<0){n=-n;d=-d}const g=gcd(n,d);this.n=n/g;this.d=d/g}
  static of(x){return x instanceof Q?x:new Q(x,1)}
  add(o){o=Q.of(o);return new Q(this.n*o.d+o.n*this.d,this.d*o.d)}
  sub(o){o=Q.of(o);return new Q(this.n*o.d-o.n*this.d,this.d*o.d)}
  mul(o){o=Q.of(o);return new Q(this.n*o.n,this.d*o.d)}
  div(o){o=Q.of(o);return new Q(this.n*o.d,this.d*o.n)}
  pw(k){let r=new Q(1);for(let i=0;i<k;i++)r=r.mul(this);return r}
  abs(){return new Q(Math.abs(this.n),this.d)}
  get v(){return this.n/this.d}
  h(){return this.d===1?neg(this.n):(this.n<0?MINUS:'')+fr(Math.abs(this.n),this.d)}
  dec(){return this.d===1?'':' ≈ '+(+this.v.toFixed(3)).toString().replace('-',MINUS)}
}
const q=(n,d=1)=>new Q(n,d);
const neg=n=>n<0?MINUS+Math.abs(n):''+n;
const X='<i>x</i>', NN='<i>n</i>';
const sup=(b,e)=>`${b}<sup>${e}</sup>`;
const fr=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const sqrt=(x,idx)=>`<span class="sq">${idx?`<span class="idx">${idx}</span>`:''}√<span class="rad">${x}</span></span>`;
const M=s=>`<span class="m">${s}</span>`;
const an=k=>`<i>a</i><sub>${k}</sub>`;
const parQ=v=>{v=Q.of(v);return (v.n<0||v.d!==1)?`(${v.h()})`:v.h()};
function poly(cs,v=X){const deg=cs.length-1;let out='';
  cs.forEach((c,i)=>{const p=deg-i;if(c===0)return;const first=out==='';const a=Math.abs(c);
    const s=c<0?(first?MINUS:' '+MINUS+' '):(first?'':' + ');
    const vv=p===0?'':p===1?v:sup(v,p);const co=(p>0&&a===1)?'':''+a;out+=s+co+vv});
  return out||'0'}
const lin=(a,b,v=X)=>poly([a,b],v);
function evalPoly(cs,xv){xv=Q.of(xv);const deg=cs.length-1;let r=q(0);cs.forEach((c,i)=>{r=r.add(xv.pw(deg-i).mul(c))});return r}
function subPoly(cs,xv){const deg=cs.length-1;const xs=parQ(xv);let out='';
  cs.forEach((c,i)=>{const p=deg-i;if(c===0)return;const first=out==='';const a=Math.abs(c);
    const s=c<0?(first?MINUS:' '+MINUS+' '):(first?'':' + ');
    const body=p===0?''+a:(a===1?'':a+'·')+(p===1?xs:sup(xs,p));out+=s+body});return out||'0'}
function sumStr(list){let out='';list.forEach(v=>{v=Q.of(v);if(out==='')out=v.h();else out+=v.n<0?' '+MINUS+' '+v.abs().h():' + '+v.h()});return out||'0'}
const termVals=(cs,xv)=>{const deg=cs.length-1;return cs.map((c,i)=>Q.of(xv).pw(deg-i).mul(c)).filter((v,i)=>cs[i]!==0)};
const RELSYM={'>=':'≥','<=':'≤','>':'>','<':'<','!=':'≠','R':'Todos los reales'};
const FLIP={'>=':'<=','<=':'>=','>':'<','<':'>','!=':'!='};
const ivl=(rel,v)=>({'>=':`[${v}, ∞)`,'>':`(${v}, ∞)`,'<=':`(${MINUS}∞, ${v}]`,'<':`(${MINUS}∞, ${v})`,'!=':`ℝ ${MINUS} {${v}}`})[rel];
const yt=s=>'https://www.youtube.com/results?search_query='+encodeURIComponent(s);
function mc(o){const all=[{h:o.right,ok:1},...o.wrong.map(h=>({h,ok:0}))];const sh=shuffle(all);
  return Object.assign({kind:'mc',opts:sh.map(x=>x.h),correct:sh.findIndex(x=>x.ok)},o)}

/* ============ generadores (d = 1 básico, 2 medio, 3 exigente) ============ */
const GEN={};

GEN.bases=(d,opt)=>{const V={
  despeje(){const a=pick([2,3,4,5,6,7,8,9])*pick([1,-1]),b=rnz(-12,12),c=ri(-15,15),x=q(c-b,a);
    return{q:`Despeja ${M(X)}:`,ex:`${lin(a,b)} = ${neg(c)}`,kind:'num',label:`${M(X)} =`,ans:x,
      hint:'Primero mueve el número que suma o resta; después divide entre el número que acompaña a la x.',
      sol:[`Lo que suma o resta pasa al otro lado con el signo contrario: ${M(`${poly([a,0])} = ${neg(c)} ${b>0?MINUS+' '+b:'+ '+(-b)} = ${neg(c-b)}`)}`,
        `Lo que multiplica pasa a dividir con su mismo signo: ${M(`${X} = ${fr(neg(c-b),neg(a))} = ${x.h()}`)}`]}},
  fracc(){const a=ri(1,7),b=ri(2,9),c=ri(1,7),e=ri(2,9),op=pick([1,-1]);const r=q(a,b).add(q(op*c,e));const nu=a*e+op*c*b;
    return{q:'Calcula y simplifica:',ex:`${fr(a,b)} ${op>0?'+':MINUS} ${fr(c,e)}`,kind:'num',label:'Resultado =',ans:r,
      hint:'Multiplica en cruz: (a·d ± c·b) / (b·d). Luego simplifica.',
      sol:[`Numerador en cruz: ${M(`${a}·${e} ${op>0?'+':MINUS} ${c}·${b} = ${neg(nu)}`)}. Denominador: ${M(`${b}·${e} = ${b*e}`)}`,
        `Queda ${M(fr(neg(nu),b*e))}; simplificando: ${M(r.h())}`]}},
  negs(){const k=ri(1,4),a=rnz(-3,4),b=rnz(-6,6),c=ri(-9,9),cs=[a,b,c],xv=-k,r=evalPoly(cs,xv);
    return{q:'Calcula (ojo con los signos):',ex:subPoly(cs,xv),kind:'num',label:'Resultado =',ans:r,
      hint:`(${MINUS}${k})² es positivo: ${k*k}. Menos por menos da más.`,
      sol:[`Potencia primero: ${M(`(${MINUS}${k})<sup>2</sup> = ${k*k}`)} (un negativo al cuadrado da positivo).`,
        `Cada término: ${M(sumStr(termVals(cs,xv)))}`,`Total: ${M(r.h())}`]}},
  dosLados(){let a,c2;do{a=rnz(-7,9);c2=rnz(-7,9)}while(a===c2);const b=rnz(-12,12),e=rnz(-12,12),x=q(e-b,a-c2);
    return{q:`Despeja ${M(X)}:`,ex:`${lin(a,b)} = ${lin(c2,e)}`,kind:'num',label:`${M(X)} =`,ans:x,
      hint:'Las x a un lado, los números al otro.',
      sol:[`Pasa las ${M(X)} a la izquierda y los números a la derecha: ${M(`${poly([a,0])} ${c2>0?MINUS+' '+(c2===1?'':c2):'+ '+(c2===-1?'':-c2)}${X} = ${neg(e)} ${b>0?MINUS+' '+b:'+ '+(-b)}`)}`,
        `Reduce: ${M(`${poly([a-c2,0])} = ${neg(e-b)}`)}`,`Divide: ${M(`${X} = ${fr(neg(e-b),neg(a-c2))} = ${x.h()}`)}`]}},
  inec(){const a=-ri(2,8),b=rnz(-15,15),c=ri(-10,10),rel=pick(['>=','<=','>','<']);const v=q(c-b,a);const r2=FLIP[rel];

 };
 const pool=d===1?['difcuad']:d===2?['difcuad','trin','factorK']:['trin','dosTrin','cubo','raiz','raiz2','formas'];

function parseNum(s){
  if(s==null)return null;s=String(s).trim().replace(/[−–]/g,'-').replace(/\s+/g,'');
  s=s.replace(/^[a-zA-Z]+\(?[a-zA-Z0-9-]*\)?=/,'');
  let pct=false;if(s.endsWith('%')){pct=true;s=s.slice(0,-1)}
  s=s.replace(/,/g,'.');let m;
  if((m=s.match(/^\(?([-+]?\d*\.?\d+)\)?\/\(?([-+]?\d*\.?\d+)\)?$/))){const d=parseFloat(m[2]);if(d===0)return null;const v=parseFloat(m[1])/d;return{v:pct?v/100:v,exact:!/\./.test(s)&&!pct}}
  if(/^[-+]?\d*\.?\d+$/.test(s)){const v=parseFloat(s);return{v:pct?v/100:v,exact:!/\./.test(s)&&!pct}}
  return null}
function near(a,t){if(!a)return false;if(a.exact)return Math.abs(a.v-t)<1e-9;const diff=Math.abs(a.v-t);if(Math.abs(t)<1e-9)return diff<1e-9;return diff<=0.0051&&diff/Math.abs(t)<=0.021}

  if(p.kind==='num')return near(a.n,p.ans.v);
  if(p.kind==='pair')return near(a.n[0],p.ans[0].v)&&near(a.n[1],p.ans[1].v);
  if(p.kind==='rel'){if(a.rel!==p.ans.rel)return false;return p.ans.rel==='R'||near(a.n,p.ans.v.v)}}

    <tr><td>Límites (del PDF): sustitución, 0/0 y las 7 formas indeterminadas</td><td><a href="#limites-sustitucion">9</a> · <a href="#limites-indeterminados">10</a></td></tr>
    </tbody></table></div></section>`;
}

function viewLevel(id,tab){
  const l=LV[id],s=st(id),i=LEVELS.indexOf(l),nx=LEVELS[i+1];
  const needs=l.needs.length?`<div class="need muted" style="font-size:13px;margin-top:8px">Necesitas antes: ${l.needs.map(n=>`<a href="#${n}">${LV[n].n}. ${LV[n].sh}</a>`).join('')}</div>`:'';
  main.innerHTML=`<section class="card flat">
    <div class="eyebrow">Nivel ${l.n} de ${LEVELS.length} ${s.m?'· <span class="pill ok">Dominado</span>':''}</div>
    <h1 style="font-size:26px;margin:6px 0 4px">${l.t}</h1>${needs}
    <div class="seg" style="margin-top:14px" role="group" aria-label="Sección">
      <button type="button" aria-pressed="${tab!=='p'}" data-go="#${id}">Aprende</button>
      <button type="button" aria-pressed="${tab==='p'}" data-go="#${id}-practica">Practica</button>
    </div></section><div id="lvbody" style="display:flex;flex-direction:column;gap:16px"></div>`;
  $$('[data-go]',main).forEach(b=>b.addEventListener('click',()=>location.hash=b.dataset.go));
  const body=$('#lvbody');
  if(tab==='p'){viewPractice(body,id);return}
  const exBlock=(ex,label)=>`<div class="card"><div class="eyebrow">${label}</div><p style="margin:6px 0 10px">${ex.q}</p>
     <ol class="steps reveal-steps">${ex.steps.map((x,j)=>`<li ${j>0?'hidden':''}>${x}</li>`).join('')}</ol>
     <div class="row" style="margin-top:12px"><button type="button" class="btn" data-more>Siguiente paso</button><button type="button" class="btn ghost" data-all>Ver todo</button></div></div>`;
  body.innerHTML=`
   <div class="card sec"><h3>La idea</h3><p class="idea">${l.idea}</p><p class="muted" style="max-width:65ch;margin:10px 0 0"><b>Por qué:</b> ${l.why}</p></div>
   ${l.table?`<div class="card sec"><h3>Tabla para tener a mano</h3><div class="tw"><table class="t"><tbody>${l.table.map(r=>`<tr><td><b>${r[0]}</b></td><td class="m">${r[1]}</td><td class="${/<i>|<span/.test(r[2])?'m':''}">${r[2]}</td></tr>`).join('')}</tbody></table></div></div>`:''}
   <div class="card sec"><h3>Receta paso a paso</h3><ol class="recipe">${l.recipe.map(r=>`<li><span>${r}</span></li>`).join('')}</ol>
     ${l.examen?`<div class="examen" style="margin-top:14px"><div class="eyebrow">Así se escribe en el examen</div><p style="margin:6px 0 0">${l.examen}</p></div>`:''}</div>
   ${l.ex?`<div class="grid2">${exBlock(l.ex,'Ejemplo resuelto · intenta antes de ver cada paso')}${l.ex2?exBlock(l.ex2,'Ejemplo exigente'):`<div class="card sec"><h3>Trampas que hacen perder puntos</h3><ul class="traps">${l.traps.map(t=>`<li>${t}</li>`).join('')}</ul></div>`}</div>`:''}
   ${l.ex2||!l.ex?`<div class="card sec"><h3>Trampas que hacen perder puntos</h3><ul class="traps">${l.traps.map(t=>`<li>${t}</li>`).join('')}</ul></div>`:''}
   ${l.cuaderno?`<div class="card sec cuaderno"><h3>Modo cuaderno: escribe y luego destapa</h3>${CUADERNO.map((c,j)=>`<div class="qa"><b>${j+1}. ${c[0]}</b><div><button type="button" class="btn" style="margin-top:8px" data-rev="${j}">Ver respuesta modelo</button></div><div class="mod" hidden id="mod${j}">${c[1]}</div></div>`).join('')}</div>`:''}
   <div class="card row" style="justify-content:space-between">
     <a class="btn ghost" href="${yt(l.v)}" target="_blank" rel="noopener">▶ Videos de Julioprofe sobre este tema</a>
     <a class="btn pri big" href="#${id}-practica">Practicar este tema →</a>
   </div>`;
  $$('[data-more]',body).forEach(b=>b.addEventListener('click',()=>{const h=$('li[hidden]',b.closest('.card'));if(h)h.hidden=false;if(!$('li[hidden]',b.closest('.card')))b.disabled=true}));
  $$('[data-all]',body).forEach(b=>b.addEventListener('click',()=>{$$('li[hidden]',b.closest('.card')).forEach(x=>x.hidden=false);$('[data-more]',b.closest('.card')).disabled=true}));
  $$('[data-rev]',body).forEach(b=>b.addEventListener('click',()=>{$('#mod'+b.dataset.rev).hidden=false;b.hidden=true}));
}

function viewPractice(body,id){
  const l=LV[id];const d=S.diff[id]||3;const i=LEVELS.indexOf(l),nx=LEVELS[i+1];
  body.innerHTML=`<div class="card row" style="justify-content:space-between">
     <div class="seg" role="group" aria-label="Dificultad">${['Básico','Medio','Exigente'].map((n,j)=>`<button type="button" data-d="${j+1}" aria-pressed="${d===j+1}">${n}</button>`).join('')}</div>
     <div class="statbar" id="stbar"></div></div>
   <div class="card prob" id="pcard"></div>`;
  $$('[data-d]',body).forEach(b=>b.addEventListener('click',()=>{S.diff[id]=+b.dataset.d;save();viewPractice(body,id)}));
  const bar=()=>{const s=st(id);$('#stbar').innerHTML=`<span>Aciertos <b>${s.c[d-1]}/${s.t[d-1]}</b> en este nivel</span><span>Racha exigente <b>${s.k}/${NEED_STREAK}</b></span>${s.m?'<span class="pill ok">Dominado</span>':''}`};
  bar();
  const card=$('#pcard');
  const next=()=>{const p=GEN[genKey(id)](d);const uid='p'+(++UID);delete card.dataset.lock;delete card.dataset.sel;delete card.dataset.rel;
    card.innerHTML=`<div class="tag">${l.t} · ${['Básico','Medio','Exigente'][d-1]}</div>${problemHtml(p,uid)}
     <div class="row" style="margin-top:14px" id="acts"><button type="button" class="btn pri" id="chk">Revisar</button><button type="button" class="btn ghost" id="hint">Pista</button><button type="button" class="btn ghost" id="idk">No sé, enséñame</button></div><div id="fbx"></div>`;
    const done=(a,gaveUp)=>{if(card.dataset.lock)return;const ok=!gaveUp&&grade(p,a);lockShow(card,p,a);
      const s=st(id);s.t[d-1]++;if(ok)s.c[d-1]++;let msg='';
      if(d===3){s.k=ok?s.k+1:0;if(s.k>=NEED_STREAK&&!s.m){s.m=true;msg=`<p style="margin:8px 0 0"><b>Nivel dominado.</b> ${nx?`Sigue con <a href="#${nx.id}">${nx.n}. ${nx.sh}</a>.`:'Pasa a la <a href="#ronda-final">ronda final</a>.'}</p>`}}
      save();bar();nav();
      $('#fbx').innerHTML=`<div class="fb ${ok?'ok':gaveUp?'info':'bad'}"><div class="h">${ok?'Correcto':gaveUp?'Así se hace':'No es así'}</div>
        ${ok?'':`<div>Respuesta correcta: ${ansHtml(p)}</div>`}${a&&!ok&&!gaveUp?`<div class="muted" style="font-size:13px">Tú pusiste: ${a.raw}</div>`:''}
        ${ok?`<details><summary>Ver el procedimiento</summary>${solHtml(p)}</details>`:`<div style="margin-top:10px"><b>Procedimiento:</b>${solHtml(p)}</div>`}${msg}</div>`;
      $('#acts').innerHTML=`<button type="button" class="btn pri" id="nxt">Siguiente ejercicio →</button>${s.m&&nx?`<a class="btn" href="#${nx.id}">Siguiente nivel</a>`:''}`;
      $('#nxt').addEventListener('click',next);$('#nxt').focus()};
    const check=()=>{const a=readAns(card,p);if(!a){$('#fbx').innerHTML=`<div class="fb info"><div class="h">Falta tu respuesta</div>${p.kind==='rel'?'Elige el signo (≥, >, ≤, <, ≠ o todos los reales) y escribe el número.':p.kind==='mc'?'Elige una opción.':'Escribe un número. Fracciones con /, por ejemplo −5/4.'}</div>`;return}
      if((p.kind==='num'&&!a.n)||(p.kind==='pair'&&a.n.some(x=>!x))||(p.kind==='rel'&&a.rel!=='R'&&!a.n)){$('#fbx').innerHTML=`<div class="fb info"><div class="h">No entendí ese número</div>Escribe solo el número: 7, −3, 1/2, −5/4 o 0,25. Sin la x.</div>`;return}
      done(a,false)};
    wire(card,p,check);
    $('#chk').addEventListener('click',check);
    $('#hint').addEventListener('click',()=>{$('#fbx').innerHTML=`<div class="fb info"><div class="h">Pista</div>${p.hint||p.sol[0]}</div>`});
    $('#idk').addEventListener('click',()=>done(null,true));
    const f=$('input.ans',card);if(f&&window.matchMedia('(min-width:861px)').matches)f.focus()};
  next();
}
const genKey=id=>({'limites-sustitucion':'limsus','limites-indeterminados':'lim00'})[id]||id;

/* ronda final */
let FIN={streak:0,n:0,ok:0,redo:[]};
function viewFinal(){
  main.innerHTML=`<section class="card flat"><div class="eyebrow">Al final de la ruta</div><h1 style="font-size:26px;margin:6px 0 6px">Ronda final exigente</h1>
   <p class="lead muted" style="margin:0">Preguntas de nivel exigente de todos los temas, mezcladas. Lo que falles vuelve a aparecer dos preguntas después, con otros números.</p></section>
   <div class="card statbar" id="fbar"></div><div class="card prob" id="fcard"></div>`;
  const ids=LEVELS.filter(l=>l.id!=='bases').map(l=>l.id);
  const bar=()=>$('#fbar').innerHTML=`<span>Racha <b>${FIN.streak}</b></span><span>Récord <b>${S.fin.best}</b></span><span>Aciertos <b>${FIN.ok}/${FIN.n}</b></span>${FIN.redo.length?`<span class="pill warn">${FIN.redo.length} por repetir</span>`:''}`;
  bar();const card=$('#fcard');
  const next=()=>{let id;const due=FIN.redo.findIndex(r=>r.at<=FIN.n);if(due>=0){id=FIN.redo[due].id;FIN.redo.splice(due,1)}else id=pick(ids);
    const l=LV[id],p=GEN[genKey(id)](3),uid='f'+(++UID);delete card.dataset.lock;delete card.dataset.sel;delete card.dataset.rel;
    card.innerHTML=`<div class="tag">${l.n}. ${l.t}</div>${problemHtml(p,uid)}<div class="row" style="margin-top:14px" id="facts"><button type="button" class="btn pri" id="fchk">Revisar</button><button type="button" class="btn ghost" id="fidk">No sé</button></div><div id="ffb"></div>`;
    const done=(a,gave)=>{if(card.dataset.lock)return;const ok=!gave&&grade(p,a);lockShow(card,p,a);FIN.n++;if(ok){FIN.ok++;FIN.streak++;if(FIN.streak>S.fin.best){S.fin.best=FIN.streak;save()}}else{FIN.streak=0;FIN.redo.push({id,at:FIN.n+2})}
      bar();nav();
      $('#ffb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><div class="h">${ok?'Correcto':'Repasa esto'}</div>${ok?'':`<div>Respuesta: ${ansHtml(p)}</div>`}${ok?`<details><summary>Ver el procedimiento</summary>${solHtml(p)}</details>`:solHtml(p)}${ok?'':`<p style="margin:8px 0 0;font-size:13px">Si no te quedó claro, vuelve a <a href="#${id}">${l.sh}</a>.</p>`}</div>`;
      $('#facts').innerHTML=`<button type="button" class="btn pri" id="fn">Siguiente →</button>`;$('#fn').addEventListener('click',next);$('#fn').focus()};
    const check=()=>{const a=readAns(card,p);if(!a||(p.kind==='num'&&!a.n)||(p.kind==='pair'&&a.n.some(x=>!x))||(p.kind==='rel'&&a.rel!=='R'&&!a.n)){$('#ffb').innerHTML=`<div class="fb info"><div class="h">Falta tu respuesta</div>Escribe solo el número (7, −3, 1/2) o elige una opción.</div>`;return}done(a,false)};
    wire(card,p,check);$('#fchk').addEventListener('click',check);$('#fidk').addEventListener('click',()=>done(null,true))};
  next();
}

/* simulacro */
let SIM=null,TICK=null;
function simItems(hard){const D=()=>hard?3:2;const D2=()=>hard?pick([2,3]):2;
  return [
   ['teoria',()=>GEN.teoria(1,'av')],['teoria',()=>GEN.teoria(1,'img')],
   ['tipos',()=>GEN.tipos(2,'Radical')],['tipos',()=>hard?GEN.tipos(3):GEN.tipos(2,'Valor absoluto')],
   ['dominio',()=>GEN.dominio(D2(),hard?pick(['raiz','raizNeg']):'raiz')],['dominio',()=>GEN.dominio(D2(),hard?pick(['log','logNeg']):'log')],['dominio',()=>GEN.dominio(D2(),hard?pick(['frac','raizDen','sinCero']):'frac')],
   ['imagen',()=>GEN.imagen(D())],['interceptos',()=>GEN.interceptos(D())],['asintotas',()=>GEN.asintotas(D(),hard?pick(['general','dos','hueco','mixto']):'general')],
   ['sucesiones',()=>GEN.sucesiones(D())],['probabilidad',()=>GEN.probabilidad(D())],
   ['limites-sustitucion',()=>GEN.limsus(D())],['limites-indeterminados',()=>GEN.lim00(D(),hard?pick(['trin','dosTrin','cubo','raiz','raiz2']):pick(['difcuad','trin']))],
   ['limites-indeterminados',()=>GEN.lim00(3,'formas')]
  ].map(([id,f])=>({id,p:f(),a:null}))}
function viewSimStart(){
  clearInterval(TICK);
  const hist=S.sims.slice(-8).reverse();
  main.innerHTML=`<section class="card flat"><div class="eyebrow">Al final de la ruta</div><h1 style="font-size:26px;margin:6px 0 6px">Simulacro del examen</h1>
   <p class="lead muted" style="margin:0">15 preguntas con la misma estructura del tablero, más límites. 35 minutos. No ves si acertaste hasta entregar. Cada simulacro trae números nuevos.</p></section>
   <div class="grid2">
    <div class="card"><h3>Como el tablero</h3><p class="muted">Dificultad media: los mismos tipos de ejercicio que vas a ver mañana.</p><button type="button" class="btn big" id="s2">Empezar simulacro normal</button></div>
    <div class="card"><h3>Exigente</h3><p class="muted">Signos negativos, trampas, dos asíntotas, huecos y límites con raíces. Si sacas 4.5 aquí, vas sobrado.</p><button type="button" class="btn pri big" id="s3">Empezar simulacro exigente</button></div>
   </div>
   ${hist.length?`<div class="card"><h3 style="margin-bottom:8px">Tus simulacros</h3><div class="tw"><table class="t"><thead><tr><th>Hora</th><th>Tipo</th><th>Aciertos</th><th>Nota</th><th>Tiempo</th></tr></thead><tbody>${hist.map(s=>`<tr><td>${new Date(s.t).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})}</td><td>${s.hard?'Exigente':'Normal'}</td><td style="font-variant-numeric:tabular-nums">${s.c}/${s.tot}</td><td><span class="pill ${s.n>=4.5?'ok':s.n>=3?'warn':'bad'}">${s.n.toFixed(1)}</span></td><td style="font-variant-numeric:tabular-nums">${Math.floor(s.secs/60)}:${String(s.secs%60).padStart(2,'0')}</td></tr>`).join('')}</tbody></table></div></div>`:''}`;
  $('#s2').addEventListener('click',()=>startSim(false));$('#s3').addEventListener('click',()=>startSim(true));
}
function startSim(hard){SIM={hard,items:simItems(hard),i:0,start:Date.now(),dur:35*60,done:false};renderSim()}
function saveCur(){if(!SIM||SIM.done)return;const card=$('#scard');if(!card)return;const it=SIM.items[SIM.i];it.a=readAnsKeep(card,it.p)}
function renderSim(){
  clearInterval(TICK);
  const it=SIM.items[SIM.i],uid='s'+(++UID);
  main.innerHTML=`<section class="card row" style="justify-content:space-between"><div><div class="eyebrow">Simulacro ${SIM.hard?'exigente':'normal'}</div><div style="font-weight:600">Pregunta ${SIM.i+1} de ${SIM.items.length}</div></div><div class="timer" id="tm"></div></section>
   <div class="card"><div class="dots">${SIM.items.map((x,j)=>`<button type="button" class="dot ${x.a?'ans':''} ${j===SIM.i?'cur':''}" data-j="${j}" aria-label="Pregunta ${j+1}">${j+1}</button>`).join('')}</div></div>
   <div class="card prob" id="scard"><div class="tag">${LV[it.id].t}</div>${problemHtml(it.p,uid)}</div>
   <div class="row" style="justify-content:space-between"><button type="button" class="btn" id="sp" ${SIM.i===0?'disabled':''}>← Anterior</button>
     <div class="row">${SIM.i<SIM.items.length-1?`<button type="button" class="btn pri" id="sn">Siguiente →</button>`:''}<button type="button" class="btn ${SIM.i===SIM.items.length-1?'pri':''}" id="se">Entregar</button></div></div><div id="sconf"></div>`;
  const card=$('#scard');wire(card,it.p,()=>{if(SIM.i<SIM.items.length-1)go(SIM.i+1)});restore(card,it.p,it.a);
  const go=j=>{saveCur();SIM.i=j;renderSim();window.scrollTo({top:0})};
  $$('.dot',main).forEach(b=>b.addEventListener('click',()=>go(+b.dataset.j)));
  $('#sp').addEventListener('click',()=>go(SIM.i-1));$('#sn')&&$('#sn').addEventListener('click',()=>go(SIM.i+1));
  $('#se').addEventListener('click',()=>{saveCur();const miss=SIM.items.filter(x=>!x.a).length;
    $('#sconf').innerHTML=`<div class="fb info"><div class="h">¿Entregar?</div>${miss?`Te faltan ${miss} sin responder (cuentan como malas).`:'Respondiste todas.'}<div class="row" style="margin-top:10px"><button type="button" class="btn pri" id="sok">Sí, entregar</button><button type="button" class="btn ghost" id="sno">Seguir revisando</button></div></div>`;
    $('#sok').addEventListener('click',finishSim);$('#sno').addEventListener('click',()=>$('#sconf').innerHTML='')});
  const tick=()=>{const left=SIM.dur-Math.floor((Date.now()-SIM.start)/1000);const t=$('#tm');if(!t)return;if(left<=0){saveCur();finishSim();return}
    t.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;t.classList.toggle('low',left<300)};
  tick();TICK=setInterval(tick,1000);
  const f=$('input.ans',card);if(f&&window.matchMedia('(min-width:861px)').matches)f.focus();
}
function finishSim(){clearInterval(TICK);if(SIM.done)return;SIM.done=true;
  const secs=Math.min(SIM.dur,Math.floor((Date.now()-SIM.start)/1000));
  SIM.items.forEach(x=>x.ok=grade(x.p,x.a));const c=SIM.items.filter(x=>x.ok).length,tot=SIM.items.length,n=Math.round(c/tot*50)/10;
  S.sims.push({t:Date.now(),c,tot,n,secs,hard:SIM.hard});save();nav();
  const byLv={};SIM.items.forEach(x=>{(byLv[x.id]=byLv[x.id]||{c:0,t:0}).t++;if(x.ok)byLv[x.id].c++});
  const weak=Object.entries(byLv).filter(([k,v])=>v.c<v.t).map(([k])=>LV[k]);
  main.innerHTML=`<section class="card"><div class="row" style="justify-content:space-between;align-items:flex-end">
     <div><div class="eyebrow">Resultado · simulacro ${SIM.hard?'exigente':'normal'}</div><div class="nota" style="color:var(${n>=4.5?'--ok':n>=3?'--warn':'--bad'})">${n.toFixed(1)}</div><div class="muted">${c} de ${tot} correctas · ${Math.floor(secs/60)} min ${secs%60} s · ${n>=3?'aprobado':'no aprobado'} (se aprueba con 3.0)</div></div>
     <div class="row"><button type="button" class="btn pri big" id="again">Otro simulacro</button><a class="btn big" href="#ronda-final">Ronda final</a></div></div>
     ${weak.length?`<p style="margin:14px 0 0"><b>Repasa:</b> ${weak.map(l=>`<a href="#${l.id}">${l.sh}</a>`).join(' · ')}</p>`:`<p style="margin:14px 0 0"><b>Perfecto.</b> Haz uno exigente o descansa.</p>`}</section>
   <section class="card"><h3>Revisión pregunta por pregunta</h3>${SIM.items.map((x,j)=>`<div class="res-item"><div class="row" style="justify-content:space-between"><span class="tag">${j+1}. ${LV[x.id].t}</span><span class="pill ${x.ok?'ok':'bad'}">${x.ok?'Bien':'Mal'}</span></div>
     <div style="margin-top:6px">${x.p.q}</div>${x.p.ex?`<div class="m" style="font-size:19px;margin:6px 0;overflow-x:auto">${x.p.ex}</div>`:''}
     <div style="font-size:14px">Tu respuesta: ${x.a?x.a.raw:'<i class="muted">sin responder</i>'}</div>${x.ok?'':`<div style="font-size:14px">Correcta: ${ansHtml(x.p)}</div>`}
     <details ${x.ok?'':'open'}><summary>Procedimiento</summary>${solHtml(x.p)}</details></div>`).join('')}</section>`;
  $('#again').addEventListener('click',()=>startSim(SIM.hard));window.scrollTo({top:0});
}

/* router */
function route(){
  const h=location.hash.slice(1)||'inicio';
  if(SIM&&!SIM.done&&h!=='simulacro'){saveCur()}
  if(h!=='simulacro')clearInterval(TICK);
  if(h==='inicio')viewHome();
  else if(h==='ronda-final')viewFinal();
  else if(h==='simulacro'){if(SIM&&!SIM.done)renderSim();else viewSimStart()}
  else if(h.endsWith('-practica')&&LV[h.replace(/-practica$/,'')])viewLevel(h.replace(/-practica$/,''),'p');
  else if(LV[h])viewLevel(h,'a');
  else viewHome();
  nav();window.scrollTo({top:0});
}
window.addEventListener('hashchange',route);
clock();setInterval(clock,30000);route();
</script>
